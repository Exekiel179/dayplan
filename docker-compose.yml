services:
  app:
    image: exekiel179/dayplan:latest
    container_name: dayplan-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.aipaibox.com}
      - AI_MODEL=${AI_MODEL:-gemini-3.1-pro-preview}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin123456}
      - AUTH_USERS=${AUTH_USERS:-}
      - AUTH_ALLOW_REGISTRATION=${AUTH_ALLOW_REGISTRATION:-true}
      - SESSION_TTL_MS=${SESSION_TTL_MS:-86400000}
    volumes:
      - ./.data:/app/.data
