version: '3.8'

services:
  app:
    build: .
    container_name: dayplan-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.aipaibox.com}
      - AI_MODEL=${AI_MODEL:-gemini-3.1-pro-preview}
    volumes:
      - ./.data:/app/.data
