name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/planday:latest,${{ secrets.DOCKER_USERNAME }}/planday:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to ClawCloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # 如果使用 SSH Key 请把上面一行注释掉并使用下面一行：
          # key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 拉取最新镜像
            docker pull ${{ secrets.DOCKER_USERNAME }}/planday:latest
            
            # 如果容器正在运行，先停止并删除旧容器
            docker rm -f dayplan-app || true
            
            # 运行新容器并映射本地端口 (请确保你想要映射的端口是3000)
            docker run -d \
              --name dayplan-app \
              -p 3000:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/planday:latest
            
            # 可选：清理不再使用的旧镜像以节省服务器空间
            docker image prune -f
