name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: publish-docker-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive GHCR image name
        id: ghcr_vars
        shell: bash
        run: |
          set -euo pipefail
          owner_lower=$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lower}/dayplan" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (GHCR)
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ghcr_vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Backup current latest to bak (GHCR)
        env:
          IMAGE: ${{ steps.ghcr_vars.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:latest" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "${IMAGE}:bak" "${IMAGE}:latest"
          else
            echo "No existing ${IMAGE}:latest found before publish; skipping pre-publish backup."
          fi

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}

      - name: Ensure bak and verify remote tags (GHCR)
        env:
          IMAGE: ${{ steps.ghcr_vars.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail

          has_remote_ref() {
            local ref="$1"
            docker buildx imagetools inspect "$ref" >/dev/null 2>&1
          }

          require_remote_ref() {
            local ref="$1"
            local attempts="${2:-15}"
            local delay_seconds="${3:-4}"

            for ((attempt=1; attempt<=attempts; attempt++)); do
              if has_remote_ref "$ref"; then
                echo "Verified remote image: $ref"
                return 0
              fi

              if ((attempt < attempts)); then
                echo "Waiting for remote image $ref ($attempt/$attempts)..."
                sleep "$delay_seconds"
              fi
            done

            echo "::error::Remote image not found after retry window: $ref"
            return 1
          }

          require_remote_ref "${IMAGE}:latest"

          if ! has_remote_ref "${IMAGE}:bak"; then
            echo "Seeding ${IMAGE}:bak from ${IMAGE}:latest"
            docker buildx imagetools create --tag "${IMAGE}:bak" "${IMAGE}:latest"
          fi

          require_remote_ref "${IMAGE}:bak"

          if [[ "${REF_TYPE}" == "tag" ]]; then
            require_remote_ref "${IMAGE}:${REF_NAME}"
          fi

      - name: Logout from GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io || true

  publish-dockerhub:
    runs-on: ubuntu-latest
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Docker Hub credentials
        id: dockerhub_vars
        env:
          PRIMARY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PRIMARY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FALLBACK_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          FALLBACK_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          username="${PRIMARY_USERNAME:-}"
          token="${PRIMARY_TOKEN:-}"
          source_label="DOCKERHUB_*"

          if [[ -z "${username}" || -z "${token}" ]]; then
            username="${FALLBACK_USERNAME:-}"
            token="${FALLBACK_TOKEN:-}"
            source_label="DOCKER_*"
          fi

          if [[ -z "${username}" || -z "${token}" ]]; then
            echo "::error::Docker Hub credentials are not configured. Expected DOCKERHUB_USERNAME/DOCKERHUB_TOKEN or DOCKER_USERNAME/DOCKER_PASSWORD."
            exit 1
          fi

          image_namespace=$(echo "${username}" | tr '[:upper:]' '[:lower:]')
          echo "image=${image_namespace}/dayplan" >> "$GITHUB_OUTPUT"
          echo "source_label=${source_label}" >> "$GITHUB_OUTPUT"
          echo "Using ${source_label} Docker Hub credentials for ${username}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Docker metadata (DockerHub)
        id: meta_dockerhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dockerhub_vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Backup current latest to bak (DockerHub)
        env:
          IMAGE: ${{ steps.dockerhub_vars.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:latest" >/dev/null 2>&1; then
            docker pull "${IMAGE}:latest"
            docker tag "${IMAGE}:latest" "${IMAGE}:bak"
            docker push "${IMAGE}:bak"
          else
            echo "No existing ${IMAGE}:latest found before publish; skipping pre-publish backup."
          fi

      - name: Build and push (DockerHub)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}

      - name: Ensure bak and verify remote tags (DockerHub)
        env:
          IMAGE: ${{ steps.dockerhub_vars.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail

          has_remote_ref() {
            local ref="$1"
            docker buildx imagetools inspect "$ref" >/dev/null 2>&1
          }

          require_remote_ref() {
            local ref="$1"
            local attempts="${2:-15}"
            local delay_seconds="${3:-4}"

            for ((attempt=1; attempt<=attempts; attempt++)); do
              if has_remote_ref "$ref"; then
                echo "Verified remote image: $ref"
                return 0
              fi

              if ((attempt < attempts)); then
                echo "Waiting for remote image $ref ($attempt/$attempts)..."
                sleep "$delay_seconds"
              fi
            done

            echo "::error::Remote image not found after retry window: $ref"
            return 1
          }

          require_remote_ref "${IMAGE}:latest"

          if ! has_remote_ref "${IMAGE}:bak"; then
            echo "Seeding ${IMAGE}:bak from ${IMAGE}:latest"
            docker pull "${IMAGE}:latest"
            docker tag "${IMAGE}:latest" "${IMAGE}:bak"
            docker push "${IMAGE}:bak"
          fi

          require_remote_ref "${IMAGE}:bak"

          if [[ "${REF_TYPE}" == "tag" ]]; then
            require_remote_ref "${IMAGE}:${REF_NAME}"
          fi

      - name: Logout from DockerHub
        if: always()
        shell: bash
        run: docker logout || true
